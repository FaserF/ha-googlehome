name: Issue Orchestrator

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-label:
    name: Label Issue
    runs-on: ubuntu-latest
    steps:
      - name: Label Issues
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || "").toLowerCase();
            const labels = [];
            
            if (title.includes("bug") || body.includes("bug") || body.includes("fehler")) {
              labels.push("bug");
            }
            if (title.includes("feature") || title.includes("request") || body.includes("wunsch")) {
              labels.push("enhancement");
            }
            if (title.includes("documentation") || title.includes("docs") || body.includes("doku")) {
              labels.push("documentation");
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }

  auto-comment:
    name: Comment
    runs-on: ubuntu-latest
    needs: auto-label
    steps:
      - name: Comment on new issue
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            let body = "Hi @" + issue.user.login + ", thanks for opening this issue! 👋\n\n";
            const maintainerNote = "\n\n---\n*Please note: I maintain this integration in my free time as a hobby project. I will do my best to look into this soon.*";

            if (labels.includes("bug")) {
              body += "⚠️ **Bug Report Received**\n\n";
              body += "To help solve this faster, please check that you have provided debug logs and Home Assistant / integration versions.\n";
            } else if (labels.includes("enhancement")) {
              body += "🚀 **Feature Request**\n\n";
              body += "Thanks for the idea! I will review it and see how it fits into the roadmap.\n";
            } else {
              body += "I have received your issue and will look into it as soon as I can.";
            }

            body += maintainerNote;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

